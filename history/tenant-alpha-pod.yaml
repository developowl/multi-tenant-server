# 현재 사용하지 않는 정의 파일입니다.
# %%%%%%%%%%%%%%%%%%%%%%%%%%

apiVersion: v1
kind: Pod
metadata:
  name: tenant-alpha-server
  namespace: tenant-alpha
  labels:
    role: server
spec:
  containers:
  - name: ssh-container
    image: lscr.io/linuxserver/openssh-server:latest 
    env:
      - name: PUID
        value: "1000"
      - name: PGID
        value: "1000"
      - name: TZ
        value: "Asia/Seoul"
      - name: USER_NAME
        value: "tenant-user"
      - name: USER_PASSWORD
        value: "tenant-server-2001"
      - name: SUDO_ACCESS
        value: "true"
      - name: PASSWORD_ACCESS
        value: "true"

    resources:
      requests:
        cpu: "200m"
        memory: "256Mi" 
      limits:
        cpu: "500m"
        memory: "512Mi"
        ephemeral-storage: "2Gi"

    ports:
    - containerPort: ****
    
    volumeMounts:
    - name: tenant-home
      mountPath: /home/tenant
  
  volumes:
  - name: tenant-home
    persistentVolumeClaim:
      claimName: tenant-alpha-home


